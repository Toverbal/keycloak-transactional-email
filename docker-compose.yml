# Dev environment for manually testing the extension.
# Run `make dev` to build the JAR and start all services.
#
# Admin UI: http://localhost:8080/admin  (admin / admin)
# Mailhog UI: http://localhost:8025      (catches all outbound SMTP)
#
# A "dev" realm is imported at startup with Mailhog SMTP pre-configured and
# a test user (testuser / password, testuser@example.com) ready to use.

services:
  keycloak:
    image: quay.io/phasetwo/phasetwo-keycloak:26.5.7
    entrypoint:
      - /opt/keycloak/bin/kc.sh
      - start-dev
      - --import-realm
      - --spi-theme-cache-themes=false
      - --log-level=INFO,io.phasetwo:DEBUG
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_SPI_EMAIL_SENDER_SMTP_HOST: mailhog
      KC_SPI_EMAIL_SENDER_SMTP_PORT: "1025"
      JAVA_OPTS: "-Xms64m -Xmx512m -XX:MetaspaceSize=96M -XX:MaxMetaspaceSize=256m"
    ports:
      - "8080:8080"
    volumes:
      - ./target/keycloak-transactional-email.jar:/opt/keycloak/providers/keycloak-transactional-email.jar
      - ./docker/dev-realm.json:/opt/keycloak/data/import/dev-realm.json:ro
    depends_on:
      - mailhog
    healthcheck:
      test:
        ["CMD-SHELL", "curl -sf http://localhost:9000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  keycloak-config:
    image: quay.io/phasetwo/phasetwo-keycloak:26.5.7
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        /opt/keycloak/bin/kcadm.sh config credentials \
          --server http://keycloak:8080 \
          --realm master \
          --user admin \
          --password admin &&
        /opt/keycloak/bin/kcadm.sh update realms/master \
          -s sslRequired=none \
          -s 'smtpServer.host=mailhog' \
          -s 'smtpServer.port=1025' \
          -s 'smtpServer.from=keycloak@example.com' \
          -s 'smtpServer.fromDisplayName=Keycloak Dev' \
          -s 'smtpServer.auth=false' \
          -s 'smtpServer.ssl=false' \
          -s 'smtpServer.starttls=false' &&
        /opt/keycloak/bin/kcadm.sh update users/$(
          /opt/keycloak/bin/kcadm.sh get users -r master -q username=admin --fields id --format csv --noquotes
        ) -r master -s "email=${KEYCLOAK_ADMIN_EMAIL:-admin@example.com}" -s emailVerified=true &&
        /opt/keycloak/bin/kcadm.sh update users/$(
          /opt/keycloak/bin/kcadm.sh get users -r dev -q username=testuser --fields id --format csv --noquotes
        ) -r dev -s "email=${TEST_USER_EMAIL:-testuser@example.com}"
    environment:
      KEYCLOAK_ADMIN_EMAIL: ${KEYCLOAK_ADMIN_EMAIL:-admin@example.com}
      TEST_USER_EMAIL: ${TEST_USER_EMAIL:-testuser@example.com}
      JAVA_OPTS: "-Xms32m -Xmx64m"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    platform: linux/amd64
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI — open http://localhost:8025 to inspect caught emails
